services:
  # ─────────────────────────────────────────────────────────────
  # Database Service (Local PostgreSQL with automatic schema init)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: margrakshak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-road_hazard_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-road_hazard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - margrakshak-net

  # ─────────────────────────────────────────────────────────────
  # Backend API Service (Express.js, WebSockets, AI Vision)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: margrakshak-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # If DATABASE_URL is set in .env it will take precedence (e.g. Supabase),
      # otherwise defaults to the local postgres container
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/road_hazard_db}
      - JWT_SECRET_USER=${JWT_SECRET_USER:-margrakshak_secure_jwt_user_secret_key_2026}
      - JWT_SECRET_ADMIN=${JWT_SECRET_ADMIN:-margrakshak_secure_jwt_admin_secret_key_2026}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - USER_FRONTEND_URL=${USER_FRONTEND_URL:-http://localhost:3000}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-http://localhost:3001}
      - UPLOAD_DIR=./uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - margrakshak-net

  # ─────────────────────────────────────────────────────────────
  # Citizen Portal (Next.js 14 App Router)
  # ─────────────────────────────────────────────────────────────
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: margrakshak-citizen-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    networks:
      - margrakshak-net

  # ─────────────────────────────────────────────────────────────
  # Admin Operations Portal (Next.js 14 App Router)
  # ─────────────────────────────────────────────────────────────
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: margrakshak-admin-portal
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    networks:
      - margrakshak-net

# ─────────────────────────────────────────────────────────────
# Networks & Persistent Volumes
# ─────────────────────────────────────────────────────────────
networks:
  margrakshak-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

