apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-admin-deployment
  namespace: margrakshak
  labels:
    app: margrakshak-admin-portal
    app.kubernetes.io/part-of: road-hazard-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: margrakshak-admin-portal
  template:
    metadata:
      labels:
        app: margrakshak-admin-portal
    spec:
      containers:
        - name: admin-portal
          image: margrakshak-admin-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: margrakshak-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3

