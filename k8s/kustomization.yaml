apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: margrakshak

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-user-deployment.yaml
  - frontend-user-service.yaml
  - frontend-admin-deployment.yaml
  - frontend-admin-service.yaml
  - ingress.yaml
  - hpa.yaml

# Common labels applied across all resources
labels:
  - pairs:
      app.kubernetes.io/name: margrakshak
      app.kubernetes.io/part-of: road-hazard-platform
      app.kubernetes.io/managed-by: kustomize
