apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: margrakshak-ingress
  namespace: margrakshak
  labels:
    app.kubernetes.io/part-of: road-hazard-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
spec:
  rules:
    # ── Citizen Portal ──
    - host: margrakshak.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-user-service
                port:
                  number: 3000

    # ── Admin Operations Portal ──
    - host: admin.margrakshak.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-admin-service
                port:
                  number: 3001

    # ── Backend REST & WebSocket API ──
    - host: api.margrakshak.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000

